<body>
<div class="shell">
  <header class="appbar">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0F766E"/><path d="M10.2 8.5c-2 .4-3.3 2.3-3 4.6.3 2.2 1.3 3.6 1.8 5.6.5 2 .6 4.3 1.6 5.2.9.8 1.9.2 2.2-1 .4-1.6.8-3.4 3.2-3.4s2.8 1.8 3.2 3.4c.3 1.2 1.3 1.8 2.2 1 1-.9 1.1-3.2 1.6-5.2.5-2 1.5-3.4 1.8-5.6.3-2.3-1-4.2-3-4.6-2-.4-3.4.9-5.8.9s-3.8-1.3-5.8-.9z" fill="#fff"/></svg><span>DAT Prep</span></div>
    <span class="sp"></span>
    <button type="button" class="pill" id="barCount" title="Your test date">Set test date</button>
  </header>

  <nav class="tabs" aria-label="Sections">
    <button type="button" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="m8.5 14.6 2.3 2.3 4.7-4.7"/></svg>Today</button>
    <button type="button" data-tab="learn" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5c2.8-1 5.6-1 8.5.8 2.9-1.8 5.7-1.8 8.5-.8v13c-2.8-1-5.6-1-8.5.8-2.9-1.8-5.7-1.8-8.5-.8z"/><path d="M12 6.3v13"/></svg>Learn</button>
    <button type="button" data-tab="practice" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5h3.8L19.2 8.6a1.9 1.9 0 0 0 0-2.7l-1.1-1.1a1.9 1.9 0 0 0-2.7 0L4.5 15.7z"/><path d="m14 6.3 3.7 3.7"/></svg>Practice</button>
    <button type="button" data-tab="tests" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4.2l2.8 1.8M9.5 2.8h5M19.2 6.3l1.3-1.3"/></svg>Tests</button>
    <button type="button" data-tab="me" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.2" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>Me</button>
  </nav>

  <main id="main"></main>

  <footer class="foot">
    <p>Progress saves in this browser. Use Me → Back up progress to keep a copy.</p>
    <p>DAT Prep uses original lessons and questions written in the style of the test. DAT® is a registered trademark of the American Dental Association, which is not affiliated with this site.</p>
  </footer>
</div>
<button type="button" class="notes-fab" id="notesFab" aria-label="Open my notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19.5h3.8L19.2 8.6a1.9 1.9 0 0 0 0-2.7l-1.1-1.1a1.9 1.9 0 0 0-2.7 0L4.5 15.7z"/><path d="m14 6.3 3.7 3.7"/></svg>Notes</button>
